name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Leave empty for dry-run (artifacts only)."
        required: false

permissions:
  contents: read

env:
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned: lode-cli produces the asset signatures lode verifies at install time.
  LODE_VERSION: v0.1.0

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    # Only enforce for real releases (tag push or explicit tag input)
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check version format
        id: check
        run: |
          if [[ ! "${VERSION}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version format: '${VERSION}'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # The full check matrix, defined once in ci.yml. A tag push does not trigger
  # ci.yml on its own, so without this a release could ship an unchecked tree.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  package:
    name: Build app package
    needs: [validate, ci]
    if: ${{ !cancelled() && needs.ci.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # `bkd-server.tar.gz` is the lode selection key ([update].asset): fixed and
      # version-free, because lode matches an asset by exact filename.
      #
      # The name deliberately avoids the `bkd-app` prefix. Pre-lode BKD selects its
      # update with `name.startsWith('bkd-app') && name.endsWith('.tar.gz')`, and the
      # pre-lode launcher with /^bkd-app-v\d+\.\d+\.\d+\.tar\.gz$/ — either would
      # happily install this package and then run it with no supervisor and no way to
      # update itself. Under the new name they find no matching asset and stay put.
      - name: Build app package
        run: |
          set -euo pipefail
          bun install
          VERSION_NUM="${VERSION#v}"
          # Dry run (workflow_dispatch with no tag): VERSION is the branch name.
          # `package.ts` takes `dev` for exactly this case.
          if [[ ! "${VERSION_NUM}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "No release tag — packaging as a dry run"
            VERSION_NUM=dev
          fi
          bun scripts/package.ts --version "${VERSION_NUM}" --outfile bkd-server.tar.gz
          ls -lh dist/bkd-server.tar.gz && cat dist/checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: bkd-package
          path: |
            dist/bkd-server.tar.gz
            dist/checksums.txt
          retention-days: 7

  release:
    name: Create Release
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    env:
      GH_TOKEN: ${{ github.token }}
      # Optional: unset in forks, which then publish unsigned assets.
      LODE_SIGNING_KEY: ${{ secrets.LODE_SIGNING_KEY }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bkd-package
          path: artifacts/bkd-package

      - name: Prepare assets
        run: |
          set -euo pipefail
          mkdir -p release/
          cp artifacts/bkd-package/bkd-server.tar.gz release/
          cat artifacts/*/checksums.txt > release/checksums.txt
          cd release
          echo "--- Verifying checksums ---"
          sha256sum -c checksums.txt

      # Publish as a draft and flip it live only once the assets are attached.
      # A release is `/releases/latest` the moment it is published, so publishing first
      # exposes a version lode resolves but cannot install ("release X has no assets"),
      # and lode only clears that error when an update commits — a few seconds of race
      # leave a red error in the UI for days. Drafts are excluded from `latest`, so the
      # window closes. A release cut by hand is demoted to draft here for the same reason.
      - name: Create draft release
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists — hiding it until its assets land"
            gh release edit "${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft
            exit 0
          fi
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --draft \
            --generate-notes \
            --notes-file - <<'NOTES'
          ### Install

          BKD runs under the [lode](https://github.com/dotns/lode) supervisor, which fetches,
          verifies, launches and updates it.

          ```bash
          curl -fsSL https://github.com/dotns/lode/releases/download/v0.1.0/lode-linux-x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin lode lode-cli
          # an install root you own — BKD spawns coding agents, so it should not run as root
          sudo mkdir -p /opt/bkd && sudo chown "$(id -un)" /opt/bkd
          curl -fsSL https://raw.githubusercontent.com/bkhq/bkd/main/docs/bkd.lode.toml -o /opt/bkd/lode.toml
          # edit the paths marked CHANGE ME, then:
          lode --dir /opt/bkd
          ```

          Upgrading from a `bkd-launcher-*` install (keeps your database, uploads and worktrees):

          ```bash
          curl -fsSL https://raw.githubusercontent.com/bkhq/bkd/main/scripts/migrate-to-lode.ts -o migrate-to-lode.ts
          bun migrate-to-lode.ts --root /opt/bkd            # preview
          bun migrate-to-lode.ts --root /opt/bkd --apply
          ```

          | Asset | What it is |
          |---|---|
          | `bkd-server.tar.gz` | the application — configure as `[update].asset` |
          | `checksums.txt` | sha256 of the package |

          The lode config, the deployment guide and the migration script are served from the
          repository rather than published per release — they carry no version, so a correction
          reaches you without waiting for the next one:
          [`docs/bkd.lode.toml`](https://github.com/bkhq/bkd/blob/main/docs/bkd.lode.toml),
          [`docs/deployment.md`](https://github.com/bkhq/bkd/blob/main/docs/deployment.md),
          [`scripts/migrate-to-lode.ts`](https://github.com/bkhq/bkd/blob/main/scripts/migrate-to-lode.ts).

          **Pre-lode installs do not auto-update to this release.** The package was renamed
          from `bkd-app*.tar.gz`, so older BKD versions and the old launcher find no matching
          asset and keep running what they have — migrate deliberately with the script above.

          Signature verification is not enabled yet; every install is still sha256-verified.

          ---
          NOTES

      # lode matches an asset's ed25519 signature from the GitHub asset `label`, over
      # the version WITHOUT the leading `v` (the adapter strips it from the tag).
      # `lode-cli sign` prints a report; the signature is the `sig:` field.
      - name: Sign and upload assets
        run: |
          set -euo pipefail
          VERSION_NUM="${VERSION#v}"
          if [ -n "${LODE_SIGNING_KEY:-}" ]; then
            curl -fsSL "https://github.com/dotns/lode/releases/download/${LODE_VERSION}/lode-linux-x64.tar.gz" \
              | tar -xz lode lode-cli
          fi
          for f in release/bkd-server.tar.gz; do
            if [ -n "${LODE_SIGNING_KEY:-}" ]; then
              sig="$(./lode-cli sign "$f" --version "${VERSION_NUM}" --key-env LODE_SIGNING_KEY | awk '/^sig:/{print $2}')"
              if [ -z "$sig" ]; then
                echo "ERROR: could not extract a signature for $f"
                exit 1
              fi
              gh release upload "${VERSION}" "$f#$sig" --repo "${GITHUB_REPOSITORY}" --clobber
            else
              gh release upload "${VERSION}" "$f" --repo "${GITHUB_REPOSITORY}" --clobber
              echo "::warning::LODE_SIGNING_KEY not set — $(basename "$f") uploaded UNSIGNED"
            fi
          done
          gh release upload "${VERSION}" release/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Publish release
        run: |
          set -euo pipefail
          gh release edit "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest
